name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make test
      - run: make validate
      - run: make lint
      - name: nothing private and no database is tracked
        run: |
          if git ls-files | grep -E '(^|/)data/local/|\.db$'; then echo "private or database files are tracked"; exit 1; fi

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: node tools/check_drift.mjs
      - run: node tools/check_tokens.mjs
      - run: npm run lighthouse
        working-directory: site
